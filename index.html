<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="shortcut icon" href="https://img.icons8.com/plasticine/100/to-do.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Lista de Tarefas</h2>

    <div class="Aba-Status">
        <button>Realizadas</button>
        <button>Pendentes</button>
    </div>

    <input type="text" id="Nova-Tarefa" class="Input-Nova-Tarefa" placeholder="Adicionar Tarefa">
    <button>Adicionar</button>
    <div id="Aba-Pendentes" class="Conteudo Ativar">
        <ul id="Lista-Aba-Pendentes"></ul>
    </div>


    <div id="Aba-Realizadas" class="Conteudo">
        <ul id="Lista-Aba-Realizadas"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
